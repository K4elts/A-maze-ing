[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator and solver from the A-Maze-ing project"
requires-python = ">=3.10"
authors = [
    { name = "aliao-tr" },
    { name = "plopez-l" },
]

[tool.setuptools]
packages = ["mazegen"]
